<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Чаты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#14161a);--hint:var(--tg-theme-hint-color,#868d98);
--sec:var(--tg-theme-secondary-bg-color,#f0f1f4);--btn:var(--tg-theme-button-color,#3b6cf6);--btnt:var(--tg-theme-button-text-color,#fff)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--btn);outline-offset:2px}
.app{display:grid;grid-template-columns:300px 1fr;height:100dvh}
.side{background:var(--sec);overflow-y:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.side h1{font-size:19px;padding:16px 16px 8px}
.chat{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 16px}
.chat.on{background:var(--bg)}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--bg);
box-shadow:0 0 0 3px var(--ring,transparent)}
.chat .t{flex:1;min-width:0}
.chat b{display:block;font-weight:600}
.chat small{display:block;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--btn);color:var(--btnt);border-radius:10px;min-width:20px;padding:0 6px;font-size:12px;text-align:center;line-height:20px}
.new{margin:8px 16px 16px;padding:10px 14px;border-radius:12px;background:var(--btn);color:var(--btnt);font-weight:600;width:calc(100% - 32px)}
.main{display:flex;flex-direction:column;min-width:0;padding-top:env(safe-area-inset-top)}
.head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--sec)}
.head .ttl{flex:1;min-width:0}
.head small{display:block;color:var(--hint)}
.back{display:none;font-size:22px;padding:0 6px}
.act{color:var(--hint);padding:6px 10px;border-radius:8px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--sec);white-space:pre-wrap;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--btn);color:var(--btnt);border-bottom-right-radius:4px}
.m:not(.me){border-bottom-left-radius:4px}
.hint{margin:auto;text-align:center;color:var(--hint);max-width:340px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chips button{padding:9px 14px;border-radius:20px;background:var(--sec);border:2px solid var(--c)}
.dots{color:var(--hint);padding:4px 12px}
.bar{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--sec)}
.bar input{flex:1;min-width:0;padding:11px 14px;border-radius:22px;border:0;background:var(--sec);color:var(--tx);font:inherit}
.bar button{padding:0 18px;border-radius:22px;background:var(--btn);color:var(--btnt);font-weight:600}
.bar input:disabled,.bar button:disabled{opacity:.45}
@media(max-width:720px){
.app{grid-template-columns:1fr}
.app.in .side,.app:not(.in) .main{display:none}
.back{display:block}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <h1>Мои чаты</h1>
    <div id="list"></div>
    <button class="new" id="new">Новый чат с ИИ</button>
  </aside>
  <section class="main" id="main" hidden>
    <div class="head">
      <button class="back" id="back" aria-label="К списку чатов">‹</button>
      <div class="av" id="hav"></div>
      <div class="ttl"><b id="hti"></b><small id="hsu"></small></div>
      <button class="act" id="end"></button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="bar">
      <input id="in" placeholder="Сообщение" autocomplete="off">
      <button id="send">Отправить</button>
    </div>
  </section>
</div>
<script>
const tg = Telegram.WebApp; tg.ready(); tg.expand();
const $ = s => document.querySelector(s);
const COLORS = {anime:'#e0527a',football:'#2e9e5b',games:'#7c5cf0',music:'#e8a21a',movies:'#e8613c',tech:'#1fa3c9',other:'#8a8f98'};
const esc = t => t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S = {chats: [], topics: {}}, active = null, busy = new Set(), lastKey = '';

async function call(path, body = {}) {
  const r = await fetch('/api/' + path, {method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-Init-Data': tg.initData}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error(r.status);
  S = await r.json();
  if (S.notice) tg.showAlert(S.notice);
  render();
}

const icon = c => c.type === 'CLOSED' ? '🔒' : c.avatar;
const ring = c => COLORS[c.topic] || 'transparent';
const sub = c => c.type === 'CLOSED' ? 'Чат завершён' : c.topic ? S.topics[c.topic] : 'Выбери тему';

function render() {
  if (active && !S.chats.some(c => c.id === active)) active = null;
  $('#list').innerHTML = S.chats.map(c => {
    const last = c.messages.at(-1);
    return `<button class="chat ${c.id === active ? 'on' : ''}" data-id="${c.id}">
      <span class="av" style="--ring:${ring(c)}">${icon(c)}</span>
      <span class="t"><b>Чат ${c.num}</b><small>${esc(last ? last.text : sub(c))}</small></span>
      ${c.unread && c.id !== active ? `<span class="badge">${c.unread}</span>` : ''}</button>`;
  }).join('');

  const c = S.chats.find(x => x.id === active);
  $('#app').classList.toggle('in', !!c);
  $('#main').hidden = !c;
  if (!c) return;

  const av = $('#hav'); av.textContent = icon(c); av.style.setProperty('--ring', ring(c));
  $('#hti').textContent = 'Чат ' + c.num;
  $('#hsu').textContent = (c.type === 'AI' ? 'ИИ · ' : c.type === 'HUMAN' ? 'Живой собеседник · ' : '') + (c.topic ? S.topics[c.topic] : 'тема не выбрана');
  $('#end').textContent = c.type === 'HUMAN' ? 'Завершить' : c.type === 'AI' ? 'Очистить' : '';
  $('#in').disabled = $('#send').disabled = c.type === 'CLOSED';
  $('#in').placeholder = c.type === 'CLOSED' ? 'Чат завершён' : 'Сообщение';

  const key = [c.id, c.messages.length, c.type, c.topic, busy.has(c.id)].join();
  if (key === lastKey) return;
  lastKey = key;

  let h = c.messages.map(m => `<div class="m ${m.me ? 'me' : ''}">${esc(m.text)}</div>`).join('');
  if (busy.has(c.id)) h += '<div class="dots">печатает…</div>';
  if (c.type === 'AI' && !c.topic) {
    h += `<div class="hint"><b>О чём хочешь поболтать?</b><br>Выбери тему или просто напиши, что тебе интересно — так мы подберём собеседника точнее.
      <div class="chips">${Object.entries(S.topics).map(([k, l]) => `<button data-topic="${k}" style="--c:${COLORS[k]}">${l}</button>`).join('')}</div></div>`;
  }
  if (c.type === 'CLOSED') h += '<div class="hint">Чат завершён. Выбери другой слева или начни новый.</div>';
  const box = $('#msgs'), stick = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = h;
  if (stick || !box.dataset.chat || box.dataset.chat != c.id) box.scrollTop = box.scrollHeight;
  box.dataset.chat = c.id;
}

async function open(id) {
  active = id; lastKey = ''; render();
  try { await call('state', {read: id}); } catch (e) {}
}

async function send() {
  const inp = $('#in'), text = inp.value.trim();
  if (!text || !active) return;
  const id = active, c = S.chats.find(x => x.id === id);
  inp.value = '';
  c.messages.push({me: true, text});
  busy.add(id); lastKey = ''; render();
  try { await call('send', {chat: id, text}); }
  catch (e) { tg.showAlert('Не удалось отправить сообщение. Попробуй ещё раз.'); }
  busy.delete(id); lastKey = ''; render();
}

$('#list').onclick = e => { const b = e.target.closest('.chat'); if (b) open(+b.dataset.id); };
$('#msgs').onclick = async e => {
  const b = e.target.closest('[data-topic]'); if (!b) return;
  busy.add(active); lastKey = ''; render();
  try { await call('topic', {chat: active, key: b.dataset.topic}); } catch (err) {}
  busy.delete(active); lastKey = ''; render();
};
$('#new').onclick = async () => {
  await call('new'); const last = S.chats.at(-1); if (last) open(last.id);
};
$('#back').onclick = () => { active = null; render(); };
$('#end').onclick = () => {
  const c = S.chats.find(x => x.id === active); if (!c) return;
  const q = c.type === 'HUMAN' ? 'Завершить чат с собеседником?' : 'Очистить этот чат и выбрать тему заново?';
  tg.showConfirm(q, ok => { if (ok) { lastKey = ''; call('close', {chat: c.id}); } });
};
$('#send').onclick = send;
$('#in').onkeydown = e => { if (e.key === 'Enter') send(); };

call('state').then(() => { if (S.chats.length === 1 && innerWidth > 720) open(S.chats[0].id); });
setInterval(() => { if (!busy.size) call('state', {read: active}).catch(() => {}); }, 2500);
</script>
</body>
</html>
